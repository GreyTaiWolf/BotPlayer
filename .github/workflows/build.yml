name: Build

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon clean build runGameTestServer

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: botplayer-test-reports
          path: |
            build/reports/tests/
            build/test-results/
            build/gametest/
          if-no-files-found: warn

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: botplayer-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
